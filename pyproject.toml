[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "world2ts-core"
version = "0.1.0"
description = "World2TS-core toolkit for auditable event context construction"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "yfinance>=0.2",
    "numpy>=1.24",
    "pandas>=2.0",
    "tomli>=2.0; python_version < '3.11'",
    "fredapi>=0.5",
    "pyarrow>=14.0",
    "holidays>=0.50",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
analysis = [
    "PyYAML>=6.0",
]

[project.scripts]
world2ts-core = "world2ts_core.cli:app"
